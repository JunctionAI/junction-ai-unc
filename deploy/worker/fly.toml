# Fly.io sketch for the Unc worker (dry-run scheduler). Not yet deployed.
#
#   fly launch --no-deploy --copy-config --name unc-worker   (once)
#   fly secrets set ANTHROPIC_API_KEY=…                       (optional; llm-rule decisions)
#   fly deploy --config deploy/worker/fly.toml --dockerfile deploy/worker/Dockerfile
#
# One machine, never scaled to zero, never more than one (the scheduler's
# dedup is per store — two workers on MemoryStore would double-run).
# Persistence: swap MemoryStore → SupabaseStore before this matters (README).

app = "unc-worker"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # /health returns 200 while the heartbeat file is younger than 3 intervals,
  # 503 once the loop stops ticking (or during graceful shutdown).
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# SIGTERM → the loop finishes its in-flight tick, writes a final heartbeat
# (stopping: true, so the check goes 503), then exits 0.
kill_signal = "SIGTERM"
kill_timeout = "60s"
