# Fly.io sketch for the Unc worker (dry-run scheduler). Not yet deployed.
#
#   fly launch --no-deploy --copy-config --name unc-worker   (once)
#   fly secrets set ANTHROPIC_API_KEY=…                       (optional; llm-rule decisions)
#   fly deploy --config deploy/worker/fly.toml --dockerfile deploy/worker/Dockerfile
#
# One machine, never scaled to zero, never more than one (the scheduler's
# dedup is per store — two workers on MemoryStore would double-run).
# Persistence: swap MemoryStore → SupabaseStore before this matters (README).
#
# Telemetry cron (docs/IMPROVEMENT-LOOP.md): NOT Fly scheduled machines. The daemon
# ticks every minute and runs the jobs itself at their UTC slots (src/worker/jobs.ts):
#     measure       0 2 * * *    daily 02:00 UTC
#     benchmarks    0 3 * * 1    Mondays 03:00 UTC
#     self_review   0 6 * * 1    Mondays 06:00 UTC
# Per-job "already ran" markers live on the heartbeat file (/app/.unc-worker/heartbeat.json)
# so a restart / redeploy inside the 6 h look-back does not double-run; a fresh machine
# with no heartbeat re-runs at most one slot per job (every job is idempotent). The same
# loop sweeps expired oauth_states once an hour when the DB is configured.
# The one-shot flags (--measure / --self-review / --benchmarks) remain for manual runs:
#     fly ssh console -C "node dist/worker/worker/main.js --measure"
#
# Secrets the daemon honours (fly secrets set …): ANTHROPIC_API_KEY (optional),
# NEXT_PUBLIC_SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY + CONNECTOR_SECRET_KEY (live
# credentials + DB accounts; without them: fixtures + the demo account, no sweep),
# GOOGLE_ADS_DEVELOPER_TOKEN / GOOGLE_ADS_LOGIN_CUSTOMER_ID (Ads reads).

app = "unc-worker"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # /health returns 200 while the heartbeat file is younger than 3 intervals,
  # 503 once the loop stops ticking (or during graceful shutdown).
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# SIGTERM → the loop finishes its in-flight tick, writes a final heartbeat
# (stopping: true, so the check goes 503), then exits 0.
kill_signal = "SIGTERM"
kill_timeout = "60s"
